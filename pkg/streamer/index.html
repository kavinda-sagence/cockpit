<!DOCTYPE html>
<html>
<head>
    <title>Streamer</title>
    <meta charset="utf-8">
    <link href="index.css" type="text/css" rel="stylesheet">
    <script src="../base1/cockpit.js"></script>
</head>
<body>
    <main tabindex="-1">
        <section>
            <div>
                <div>
                    <label for="command">Command:</label>
                    <input id="command" type="text"/>
                </div>
                <div>
                    <label for="fw_path">Firmware Path:</label>
                    <input id="fw_path" type="text" />
                </div>
                <div>
                    <label for="stream_id">Stream ID:</label>
                    <select id="stream_id"></select>
                </div>
                <div>
                    <label for="num_frames">Number of Frames:</label>
                    <input id="num_frames" type="number" min="0" />
                </div>
                <div>
                    <button id="start">Start</button>
                    <button id="stop" disabled>Stop</button>
                    <button id="clear">Clear</button>
                    <span id="result"></span>
                </div>
                <div>
                    <pre id="output"></pre>
                </div>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
